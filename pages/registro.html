<div class="container my-5">
  <div class="card auth-card shadow-sm"><div class="card-body p-4">
    <h1 class="h3 mb-3">Crear cuenta</h1>
    <form action="#" method="post" id="formRegistro">
      <div class="mb-3"><label for="rNombre" class="form-label">Nombre completo</label><input type="text" id="rNombre" name="nombre" class="form-control" required></div>
      <div class="mb-3"><label for="rCorreo" class="form-label">Correo</label><input type="email" id="rCorreo" name="correo" class="form-control" required></div>
      <div class="mb-3"><label for="rTel" class="form-label">Teléfono</label><input type="tel" id="rTel" name="telefono" class="form-control"></div>
      <div class="mb-3"><label for="rClave" class="form-label">Contraseña</label><input type="password" id="rClave" name="clave" class="form-control" minlength="6" required></div>
      <div class="mb-3"><label for="rClave2" class="form-label">Confirmar contraseña</label><input type="password" id="rClave2" class="form-control" minlength="6" required></div>
      <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="terminos" required><label class="form-check-label" for="terminos">Acepto los términos y condiciones</label></div>
      <button type="submit" class="btn btn-success w-100">Registrarme</button>
    </form>
    <p class="mt-3 mb-0 text-center">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
  </div></div>
</div>
<script>
document.getElementById('formRegistro').addEventListener('submit', function (e) {
  if (document.getElementById('rClave').value !== document.getElementById('rClave2').value) {
    e.preventDefault(); alert('Las contraseñas no coinciden.');
  }
});
</script>
